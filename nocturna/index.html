<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda nocturna</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="m-4 bg-neutral-300">
    <section class="content-center">
        <h1 class="font-serif font-bold text-5xl m-4 p-2 bg-slate-400 text-center">Rueda Nocturna</h1>
        <p class="font-sans text-xl text-center m-2 p-2">Nuevo - Jueves a sabado</p>
        <h2 class="font-serif font-bold text-3xl text-center m-2 p-2">Descubre Medellín en bici cuando se encienden las
            luces.</h2>
        <div>
            <p class="font-sans font-bold text-xl m-2 p-2 text-center">3 Rutas</p>
            <p class="font-sans font-bold text-xl m-2 p-2 text-center">Desde $55.000</p>
        </div>
        <div class="flex flex-wrap justify-center gap-4 m-6">
            <a href=""
                class="inline-block font-sans font-semibold text-xl p-2 text-center border border-black rounded-lg bg-slate-400 shadow-lg transition hover:bg-slate-600 focus:outline-none focus:ring-4 focus:ring-slate-300">Inscríbete</a>

            <button type="button" class="rounded-lg bg-slate-200 p-4 font-semibold text-slate-800 shadow-md transition hover:bg-slate-300 focus:outline-none focus:ring-4 focus:ring-slate-500">
                Secundario
            </button>
            <button type="button" class="rounded-lg border-2 border-slate-700 p-4 font-semibold text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-slate-300">
                Contorno
            </button>

        </div>

    </section>
</body>

</html>
